# Base44 sandbox environment for this repository.
#
# The app is a dependency-free static website (HTML/CSS/JS) living in ./public.
# nginx serves those files straight from the bind-mounted working copy, so edits
# to the source are visible on the next page load without any rebuild step.
#
# Only port 3000 is public (the preview entry point).
services:
  web:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Read-only bind mount: nginx serves the live source from the repo.
      - ./public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
